<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Encuesta de degustación de cheesecakes: probá las muestras y contanos tu opinión sincera.">
<title>Un momento dulce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Concepto: una columna angosta, una pregunta por pantalla, pastelería en crema y vino. */
:root{
  --bg:#FBF5EC; --surface:#FFFCF7; --surface-2:#F5EADB;
  --fg:#3A2229; --muted:#735A60; --line:#E3D2BD;
  --accent:#7A1F35; --accent-ink:#FFF8F0; --accent-soft:#F6E4E2;
  --crust:#C89B6A; --cream:#FFF0D2; --berry:#A32443;
  --font-title:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1216; --surface:#2A1A20; --surface-2:#35222A;
    --fg:#F6E9DE; --muted:#BDA6A8; --line:#4B323B;
    --accent:#E58AA0; --accent-ink:#2A0E16; --accent-soft:#4A2530;
    --crust:#C89B6A; --cream:#F2DDB8; --berry:#D4476A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1216; --surface:#2A1A20; --surface-2:#35222A;
  --fg:#F6E9DE; --muted:#BDA6A8; --line:#4B323B;
  --accent:#E58AA0; --accent-ink:#2A0E16; --accent-soft:#4A2530;
  --crust:#C89B6A; --cream:#F2DDB8; --berry:#D4476A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1rem;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-block:0 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:14px}
.bar{height:8px;border-radius:8px 8px 0 0;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px 0 0 0;transition:width .35s ease}
.crust{height:5px;background:var(--crust);border-radius:0 0 6px 6px}
.stage{padding-top:28px;display:flex;flex-direction:column;gap:20px;min-width:0}
.stage.fwd{animation:inF .32s ease both}
.stage.back{animation:inB .32s ease both}
@keyframes inF{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.eyebrow{margin:0;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1,h2,p{margin:0}
h1:focus{outline:none}
.visually{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.q{font-size:1.3rem;line-height:1.3;font-weight:600;text-wrap:balance}
.title{font-family:var(--font-title);font-style:italic;font-weight:600;font-size:clamp(2.5rem,12vw,3.4rem);line-height:1;color:var(--accent);text-align:center}
.display{font-family:var(--font-title);font-weight:600;font-size:1.9rem;line-height:1.1;text-wrap:balance}
.lead{font-size:1.05rem;color:var(--fg)}
.muted{color:var(--muted)}
.center{text-align:center;align-items:center}
.art{display:block;margin:0 auto;width:150px;max-width:60%;height:auto}
.s-crust{fill:var(--crust)} .s-cream{fill:var(--cream)} .s-front{fill:var(--surface-2)}
.s-berry{fill:var(--berry)} .s-leaf{stroke:var(--accent);fill:none} .s-line{stroke:var(--fg);stroke-opacity:.18;fill:none}
.s-glass{fill:var(--surface-2);stroke:var(--muted)} .s-water{fill:var(--crust);fill-opacity:.35}
.s-hl{fill:var(--accent-ink);fill-opacity:.55}
.notice{border:2px solid var(--accent);background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.notice strong{font-size:1.02rem;letter-spacing:.04em;color:var(--accent)}
.needs{display:flex;flex-direction:column;gap:2px;font-size:.95rem}
.needs span:first-child{font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{min-height:56px;border-radius:14px;border:2px solid transparent;padding:0 20px;font-weight:600;font-size:1.05rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:62px;font-size:1.15rem;width:100%}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;align-self:center;font-size:.92rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:12px}
/* Escala 1-5 */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sc{position:relative;display:block}
.sc input,.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sc span{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:50%;aspect-ratio:1;max-width:100%;background:var(--surface);border:2px solid var(--line);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.sc input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sc input:focus-visible+span,.opt input:focus-visible+.mk{outline:3px solid var(--accent);outline-offset:3px}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);margin-top:-8px}
.ends span{max-width:45%}.ends span:last-child{text-align:right}
.meaning{min-height:1.5em;font-weight:600;color:var(--accent);text-align:center;margin-top:-6px}
/* Opciones */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{position:relative;display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:500;font-size:1.05rem;line-height:1.3}
.opt .mk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.opt .mk::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent);transform:scale(0)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input:checked+.mk{border-color:var(--accent)}
.opt input:checked+.mk::after{transform:scale(1)}
.opt span.t{min-width:0}
/* Abiertas */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:600;font-size:1.1rem;line-height:1.3}
.tag{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
textarea,input.txt{width:100%;min-height:120px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:12px 14px;resize:vertical;font-size:1rem;line-height:1.5}
.desc{border-radius:14px;padding:16px;background:var(--surface);border:2px solid var(--line);white-space:pre-line}
.desc.pending{border-style:dashed;border-color:var(--crust);color:var(--muted);background:transparent}
.badge{width:116px;height:116px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-title);font-size:4.6rem;font-weight:600;line-height:1;box-shadow:0 0 0 8px var(--accent-soft)}
.note{border-left:3px solid var(--crust);padding:8px 12px;font-size:.92rem;color:var(--muted);background:var(--surface);border-radius:0 10px 10px 0}
@media (prefers-reduced-motion:reduce){
  .stage.fwd,.stage.back{animation:none}
  .bar i{transition:none}
}

input.txt{min-height:56px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1rem}
.help{font-size:.9rem;color:var(--muted)}
.thanks-actions{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top" hidden>
    <div class="bar" id="bar" role="progressbar" aria-label="Avance de la encuesta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barFill"></i></div>
    <div class="crust"></div>
  </header>
  <main class="stage" id="stage"></main>
</div>
<nav class="nav" id="nav" hidden aria-label="Navegación de la encuesta">
  <div>
    <button type="button" class="btn btn-ghost" id="btnBack">Atrás</button>
    <button type="button" class="btn btn-primary" id="btnNext">Siguiente</button>
  </div>
</nav>
<script>
/* ============ CONFIGURACIÓN (editá solo esta parte) ============ */
const CONFIG = {
  // Letra de la muestra de referencia (cheesecake tradicional con azúcar).
  letraReferencia: "A",
  // Letra de la muestra del producto (versión saludable que se va a vender).
  letraProducto: "B",
  // Ingredientes o descripción REAL de la receta. Si queda vacío, la encuesta
  // muestra un aviso de "Descripción pendiente". No inventes ingredientes ni beneficios.
  descripcionProducto: "",
  // Nombre de esta degustación; se guarda con cada respuesta para separar tandas.
  degustacion: "cheesecake-1",
  // Rangos de precio para una rebanada individual. v = valor que se guarda, t = texto visible.
  precios: [
    {v:"menos_80", t:"Menos de C$80"},
    {v:"80_120", t:"C$80 – C$120"},
    {v:"120_160", t:"C$120 – C$160"},
    {v:"mas_160", t:"Más de C$160"},
    {v:"no_pagaria", t:"No lo pagaría"}
  ],
  // Conexión a Supabase (la clave anon es pública; solo permite insertar).
  supabase: {
    url: "https://nfdqkkvhudcmcgqupgsj.supabase.co",
    tabla: "degustacion_respuestas",
    key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZHFra3ZodWRjbWNncXVwZ3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4MjA0MDAsImV4cCI6MjA3NjM5NjQwMH0.-2uzZIxTbGia5bp2QuKFOAyIVzaRu9_pVxsznAkqVNI"
  }
};
/* ================================================================ */

const REF = CONFIG.letraReferencia, PROD = CONFIG.letraProducto;
const LETRAS = [REF, PROD].slice().sort().join(" y ");
const MEANING = {1:"No me gustó nada",2:"Me gustó poco",3:"Ni me gustó ni me disgustó",4:"Me gustó",5:"Me gustó mucho"};
const DULZOR = [["menos","Menos dulce de lo que me gusta"],["justo","Justo como me gusta"],["mas","Más dulce de lo que me gusta"]];
const COMPRA = [["si","Sí"],["tal_vez","Tal vez, dependiendo del precio y del tamaño de la porción"],["no","No"]];
const PRECIOS = CONFIG.precios.map(p => [p.v, p.t]);
const SEGUIMIENTO = {
  si:"¿Qué es lo que más te motivaría a comprarlo?",
  tal_vez:"¿Qué necesitarías saber o qué tendría que mejorar para decidirte?",
  no:"¿Cuál sería el principal motivo por el que no lo comprarías?"
};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Orden de las muestras (50/50, se conserva al recargar) ---------- */
function pickOrden(){
  try {
    const s = sessionStorage.getItem("umd_orden");
    if(s === "referencia_primero" || s === "producto_primero") return s;
  } catch {}
  const o = Math.random() < 0.5 ? "referencia_primero" : "producto_primero";
  try { sessionStorage.setItem("umd_orden", o); } catch {}
  return o;
}
const ORDEN = pickOrden();

/* Secuencia de pantallas según el orden */
const bloqueRef = [{id:"cue",who:"ref"},{id:"saborRef"},{id:"dulzorRef"}];
const bloqueProd = [{id:"cue",who:"prod"},{id:"saborProd"},{id:"texturaProd"},{id:"dulzorProd"},{id:"abiertas"}];
const agua = who => ({id:"cue",who,agua:true});
const STEPS = [{id:"welcome"}].concat(
  ORDEN === "referencia_primero"
    ? [...bloqueRef, ...bloqueProd.map((s,i) => i===0 ? agua("prod") : s)]
    : [...bloqueProd, ...bloqueRef.map((s,i) => i===0 ? agua("ref") : s)],
  [{id:"compra"},{id:"precio"},{id:"motivo"}]
);
const LAST = STEPS.length - 1;     // último paso de la encuesta (envía)
const THANKS = STEPS.length;       // pantalla de gracias
const REQUERIDO = {saborRef:"saborRef",dulzorRef:"dulzorRef",saborProd:"saborProd",texturaProd:"texturaProd",dulzorProd:"dulzorProd",compra:"compra",precio:"precio"};

const state = {step:0, dir:1, a:{}, sending:false, pendientes:0, retrying:false, retryDone:false};
let autoTimer = 0;

/* ---------- Dibujos ---------- */
const SLICE = `<svg class="art" viewBox="0 0 160 120" role="img" aria-label="Porción de cheesecake con fresa encima">
<path class="s-crust" d="M22 86h116v10a5 5 0 0 1-5 5H27a5 5 0 0 1-5-5z"/>
<path class="s-front" d="M22 56l116-12v42H22z"/>
<path class="s-line" d="M22 70c20 3 40-4 60-1s40 3 56-2"/>
<path class="s-cream" d="M22 56l116-12-20-10-76 8z"/>
<circle class="s-berry" cx="96" cy="33" r="8"/>
<circle class="s-hl" cx="93" cy="30" r="2"/>
<path class="s-leaf" stroke-width="2" stroke-linecap="round" d="M96 25c0-5 3-8 7-9M96 25c-3-3-6-4-9-3"/>
</svg>`;
const WATER = `<svg class="art" viewBox="0 0 120 120" role="img" aria-label="Vaso de agua">
<path class="s-glass" stroke-width="3" stroke-linejoin="round" d="M30 22h60l-6 80a6 6 0 0 1-6 5H42a6 6 0 0 1-6-5z"/>
<path class="s-water" d="M33 52c9-5 17 5 27 0s17 5 27 0l-3 50a4 4 0 0 1-4 4H42a4 4 0 0 1-4-4z"/>
</svg>`;

/* ---------- Piezas ---------- */
function scale(key, q, sec){
  const v = state.a[key];
  const items = [1,2,3,4,5].map(i => `<label class="sc"><input type="radio" name="${key}" id="${key}-${i}" value="${i}"${v===i?" checked":""} aria-label="${i}, ${MEANING[i]}"><span aria-hidden="true">${i}</span></label>`).join("");
  return `<p class="eyebrow">${sec}</p><h1 class="q" id="qh" tabindex="-1">${q}</h1>
  <div class="scale" role="radiogroup" aria-labelledby="qh">${items}</div>
  <div class="ends"><span>No me gustó nada</span><span>Me gustó mucho</span></div>
  <p class="meaning" id="meaning" aria-live="polite">${v?MEANING[v]:""}</p>`;
}
function choice(key, q, sec, list, extraTop = ""){
  const v = state.a[key];
  const items = list.map(([val,txt]) => `<label class="opt"><input type="radio" name="${key}" id="${key}-${val}" value="${val}"${v===val?" checked":""}><span class="mk" aria-hidden="true"></span><span class="t">${esc(txt)}</span></label>`).join("");
  return `${extraTop}<p class="eyebrow">${sec}</p><h1 class="q" id="qh" tabindex="-1"${extraTop?' style="margin-top:8px"':""}>${q}</h1><div class="opts" role="radiogroup" aria-labelledby="qh">${items}</div>`;
}

function view(step){
  const secRef = `Muestra ${REF}`, secProd = `Muestra ${PROD}`;
  switch(step.id){
    case "welcome": return `${SLICE}
      <h1 class="title" id="qh" tabindex="-1">Un momento dulce</h1>
      <div style="display:flex;flex-direction:column;gap:10px">
        <p class="lead">Gracias por ayudarnos a mejorar nuestros cheesecakes. Tené a mano las muestras ${LETRAS} y un vaso de agua. Probá cada muestra en el orden que te indiquemos y respondé según tu propia experiencia.</p>
        <p class="lead">Nos ayuda más saber qué no te gustó que escuchar que todo está rico. Sé sincero, de verdad.</p>
      </div>
      <div class="notice"><strong>PRIMERO RESPONDÉ, DESPUÉS COMENTÁ.</strong><p>No compartás ni escuchés opiniones hasta que todas las personas que estén degustando con vos hayan enviado sus respuestas.</p></div>
      <div class="needs"><span>Lo que necesitás</span><span>Muestras ${LETRAS} · un vaso de agua</span></div>
      <button type="button" class="btn btn-primary big" id="btnStart">Empezar</button>`;
    case "cue": {
      const L = step.who === "ref" ? REF : PROD;
      if(step.agua) return `<p class="eyebrow">Muestra ${L}</p><div class="center" style="display:flex;flex-direction:column;gap:16px">${WATER}<h1 class="display" id="qh" tabindex="-1">Tomá un poco de agua y después probá la muestra ${L}.</h1></div>`;
      return `<p class="eyebrow">Muestra ${L}</p><div class="center" style="display:flex;flex-direction:column;gap:20px"><div class="badge" aria-hidden="true">${L}</div><h1 class="display" id="qh" tabindex="-1">Probá la muestra ${L} antes de responder.</h1></div>`;
    }
    case "saborRef": return scale("saborRef", `¿Cuánto te gustó el sabor de la muestra ${REF}?`, secRef);
    case "dulzorRef": return choice("dulzorRef", `Para tu gusto, ¿cómo estuvo el dulzor de la muestra ${REF}?`, secRef, DULZOR);
    case "saborProd": return scale("saborProd", `¿Cuánto te gustó el sabor de la muestra ${PROD}?`, secProd);
    case "texturaProd": return scale("texturaProd", `¿Cuánto te gustó la textura de la muestra ${PROD}?`, secProd);
    case "dulzorProd": return choice("dulzorProd", `Para tu gusto, ¿cómo estuvo el dulzor de la muestra ${PROD}?`, secProd, DULZOR);
    case "abiertas": return `<p class="eyebrow">${secProd}</p><h1 class="visually q" id="qh" tabindex="-1">Tus comentarios sobre la muestra ${PROD}</h1>
      <div class="field"><span class="tag">Opcional</span><label for="regusto">Después de probar la muestra ${PROD}, ¿te quedó algún sabor en la boca que quisieras comentar?</label><textarea id="regusto" data-open="regusto" maxlength="1000">${esc(state.a.regusto)}</textarea></div>
      <div class="field"><span class="tag">Opcional</span><label for="mejoras">¿Hay algo que cambiarías o mejorarías de la muestra ${PROD}?</label><textarea id="mejoras" data-open="mejoras" maxlength="1000">${esc(state.a.mejoras)}</textarea></div>`;
    case "compra": {
      const d = (CONFIG.descripcionProducto || "").trim();
      const box = d ? `<div class="desc">${esc(d)}</div>` : `<div class="desc pending">Descripción pendiente: agregá aquí los ingredientes reales de la receta (CONFIG.descripcionProducto).</div>`;
      return choice("compra", "¿Te interesaría comprar esta versión de cheesecake?", "Interés de compra", COMPRA,
        `<h2 class="display">La muestra ${PROD} es la versión que queremos vender</h2><p class="lead muted">Es nuestra alternativa saludable.</p>${box}`);
    }
    case "precio": return choice("precio", "¿Cuánto pagarías por una rebanada individual de esta versión?", "Interés de compra", PRECIOS);
    case "motivo": {
      const q = SEGUIMIENTO[state.a.compra] || SEGUIMIENTO.tal_vez;
      return `<p class="eyebrow">Interés de compra</p>
      <div class="field"><span class="tag">Opcional</span><h1 class="q" id="qh" tabindex="-1"><label for="motivo">${q}</label></h1><textarea id="motivo" data-open="motivo" maxlength="1000">${esc(state.a.motivo)}</textarea></div>
      <div class="field"><span class="tag">Opcional</span><label for="nombre">Tu nombre</label><input class="txt" type="text" id="nombre" data-open="nombre" maxlength="60" autocomplete="off" value="${esc(state.a.nombre)}"><p class="help">Podés dejarlo en blanco. Preferimos tu opinión sincera.</p></div>`;
    }
    case "thanks": return `${SLICE}
      <h1 class="title" id="qh" tabindex="-1">¡Gracias!</h1>
      <p class="lead center">¡Gracias por probar y compartir tu opinión! Tus respuestas nos ayudan a mejorar. <strong>Cuando todas las personas que estén degustando con vos hayan enviado su encuesta,</strong> pueden compartir sus comentarios.</p>
      <div class="thanks-actions" id="thanksBox"></div>`;
  }
  return "";
}
const stepAt = n => n >= THANKS ? {id:"thanks"} : STEPS[n];

/* ---------- Render y navegación ---------- */
function render(){
  clearTimeout(autoTimer);
  const st = $("stage"), step = stepAt(state.step);
  st.classList.remove("fwd","back"); void st.offsetWidth; st.classList.add(state.dir > 0 ? "fwd" : "back");
  st.innerHTML = view(step);
  bind(step);
  if(step.id === "thanks") renderThanks();
  chrome();
  window.scrollTo(0,0);
  const h = $("qh"); if(h) h.focus({preventScroll:true});
}
function canAdvance(){ const k = REQUERIDO[STEPS[state.step]?.id]; return !k || state.a[k] !== undefined; }
function chrome(){
  const s = state.step, inSurvey = s >= 1 && s <= LAST;
  $("top").hidden = !inSurvey; $("nav").hidden = !inSurvey;
  if(!inSurvey) return;
  const pct = Math.round(s / LAST * 100);
  $("barFill").style.width = pct + "%";
  $("bar").setAttribute("aria-valuenow", pct);
  const id = STEPS[s].id, n = $("btnNext");
  n.textContent = state.sending ? "Enviando…" : id === "cue" ? "Ya la probé" : id === "abiertas" ? "Continuar" : s === LAST ? "Enviar respuestas" : "Siguiente";
  n.disabled = state.sending || !canAdvance();
  $("btnBack").disabled = state.sending;
}
function go(n, dir){ state.step = n; state.dir = dir; render(); }
function next(){ if(!canAdvance() || state.sending) return; state.step === LAST ? submit() : go(state.step + 1, 1); }
function back(){ if(state.step > 0 && state.step <= LAST && !state.sending) go(state.step - 1, -1); }

function bind(step){
  const st = $("stage");
  if(step.id === "welcome") $("btnStart").onclick = () => go(1, 1);
  st.querySelectorAll('input[type="radio"]').forEach(inp => inp.addEventListener("change", () => {
    const k = inp.name, v = /^(compra|precio|dulzor)/.test(k) ? inp.value : Number(inp.value);
    if(k === "compra" && state.a.compra !== v) delete state.a.motivo;
    state.a[k] = v;
    const m = $("meaning"); if(m) m.textContent = MEANING[v] || "";
    chrome();
    const at = state.step;
    clearTimeout(autoTimer);
    if(reduced) next(); else autoTimer = setTimeout(() => { if(state.step === at) next(); }, 400);
  }));
  st.querySelectorAll("[data-open]").forEach(t => t.addEventListener("input", () => { state.a[t.dataset.open] = t.value; }));
}
$("btnNext").onclick = next;
$("btnBack").onclick = back;

/* ---------- Envío a Supabase ---------- */
const PEND_KEY = "umd_pendientes";
function loadPend(){ try { const a = JSON.parse(localStorage.getItem(PEND_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch { return []; } }
function savePend(a){ try { localStorage.setItem(PEND_KEY, JSON.stringify(a)); } catch {} }

async function postOnce(doc){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 10000);
  try {
    const { url, tabla, key } = CONFIG.supabase;
    const r = await fetch(`${url}/rest/v1/${tabla}`, {
      method:"POST", signal:ctl.signal,
      headers:{apikey:key, Authorization:`Bearer ${key}`, "Content-Type":"application/json", Prefer:"return=minimal"},
      body:JSON.stringify(doc)
    });
    return r.ok;
  } catch { return false; }
  finally { clearTimeout(timer); }
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function postWithRetry(doc){
  if(await postOnce(doc)) return true;
  await wait(1500);
  return postOnce(doc);
}

async function submit(){
  state.sending = true; chrome();
  const t = (k, max = 1000) => String(state.a[k] || "").trim().slice(0, max);
  const doc = {
    degustacion: CONFIG.degustacion || "cheesecake-1",
    orden: ORDEN,
    letra_referencia: REF, letra_producto: PROD,
    sabor_referencia: state.a.saborRef, dulzor_referencia: state.a.dulzorRef,
    sabor_producto: state.a.saborProd, textura_producto: state.a.texturaProd, dulzor_producto: state.a.dulzorProd,
    regusto: t("regusto"), mejoras: t("mejoras"),
    compra: state.a.compra, motivo_compra: t("motivo"),
    precio: String(state.a.precio || ""),
    nombre: t("nombre", 60)
  };
  const ok = await postWithRetry(doc);
  if(!ok){ const p = loadPend(); p.push(doc); savePend(p); }
  state.pendientes = loadPend().length;
  state.sending = false;
  go(THANKS, 1);
}

function renderThanks(){
  const box = $("thanksBox"); if(!box) return;
  if(state.retryDone){
    box.innerHTML = `<p class="note" role="status">¡Listo! Tus respuestas se enviaron.</p>`; return;
  }
  if(state.pendientes <= 0){ box.innerHTML = ""; return; }
  box.innerHTML = `<p class="note" role="status">No pudimos guardar tus respuestas en línea. Avisale a quien organizó la degustación.</p>
    <button type="button" class="btn btn-ghost" id="btnRetry"${state.retrying?" disabled":""}>${state.retrying?"Reintentando…":"Reintentar envío"}</button>`;
  $("btnRetry").onclick = retry;
}
async function retry(){
  if(state.retrying) return;
  state.retrying = true; renderThanks();
  const left = [];
  for(const d of loadPend()){ if(!(await postOnce(d))) left.push(d); }
  savePend(left);
  state.pendientes = left.length; state.retrying = false;
  if(!left.length) state.retryDone = true;
  renderThanks();
}

render();

</script>
